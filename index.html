<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10152b" />
    <meta name="description" content="KICKERS — create your fighter and enter the arena." />
    <title>KICKERS — Create Your Fighter</title>
  </head>
  <body>
    <main id="app">
      <div class="topbar">
        <div class="brand">KICKERS</div>
        <div class="round-label">ARENA PROTOTYPE <span id="status">READY</span></div>
      </div>
      <div class="help">Build your fighter, then test the arena.</div>
      <button id="creator-toggle" class="creator-toggle">CUSTOMIZE</button>
      <section id="creator" class="creator-panel">
        <div class="creator-heading"><div><span class="eyebrow">FIGHTER LAB</span><h2>CREATE YOUR CHARACTER</h2></div><span class="live-tag">3D PREVIEW</span></div>
        <div class="creator-grid">
          <label>Skin color<input id="skin-color" type="color" value="#4de2d0"></label>
          <label>Outfit color<input id="outfit-color" type="color" value="#ffb84d"></label>
          <label>Shoe color<input id="shoe-color" type="color" value="#24243a"></label>
          <label>Hair color<input id="hair-color" type="color" value="#26314d"></label>
        </div>
        <div class="creator-grid">
          <label>Hair style<select id="hair-style"><option value="none">Bald</option><option value="smooth">Smooth cap</option><option value="spiky">Spiky</option><option value="cap">Baseball cap</option></select></label>
          <label>Accessory<select id="accessory"><option value="none">None</option><option value="glasses">Glasses</option><option value="crown">Crown</option><option value="horns">Horns</option></select></label>
        </div>
        <div class="sliders">
          <label>Body width <output id="body-width-value">1.0</output><input id="body-width" type="range" min="0.7" max="1.5" step="0.1"></label>
          <label>Body height <output id="body-height-value">1.0</output><input id="body-height" type="range" min="0.7" max="1.5" step="0.1"></label>
          <label>Head size <output id="head-size-value">1.0</output><input id="head-size" type="range" min="0.7" max="1.5" step="0.1"></label>
          <label>Leg length <output id="leg-length-value">1.0</output><input id="leg-length" type="range" min="0.7" max="1.5" step="0.1"></label>
        </div>
        <div class="creator-footer"><span id="saved-label">DESIGN IS PREVIEWED LIVE</span><button id="save-character">SAVE CHARACTER</button></div>
      </section>
      <div class="controls">
        <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
        <button id="kick" class="kick-button" aria-label="Kick">KICK</button>
      </div>
      <div class="desktop-hint">WASD / Arrow keys to move · Space to kick</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
