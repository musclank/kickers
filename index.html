<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10152b" />
    <meta name="description" content="KICKERS — a chaotic cartoon arena brawler." />
    <title>KICKERS — Last One Standing</title>
  </head>
  <body>
    <main id="app">
      <div class="topbar">
        <div class="brand">KICKERS</div>
        <div class="round-label">ARENA PROTOTYPE <span id="status">READY</span></div>
      </div>
      <div class="help">Move around the arena. Get close and kick your rivals off.</div>
      <div class="controls">
        <div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
        <button id="kick" class="kick-button" aria-label="Kick">KICK</button>
      </div>
      <div class="desktop-hint">WASD / Arrow keys to move · Space to kick</div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
